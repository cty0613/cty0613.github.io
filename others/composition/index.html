               · 정지 썸네일: assets/img/others/composition/<slug>.webp (1:1, 720px)
               · 미리보기: img 뒤에 <video class="detail-gallery__preview" src="…/<slug>.mp4" muted loop playsinline preload="none"> (무음 짧은 H.264 클립, 셀 비율에 맞춰 가운데가 잘림)

                 미리보기를 두지 않으면 클릭만 동작 -->
